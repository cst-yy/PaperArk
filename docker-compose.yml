services:
  db:
    image: pgvector/pgvector:pg16
    container_name: paper_workspace_db
    environment:
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: paper123
      POSTGRES_DB: paper_workspace
    ports:
      - "5432:5432"
    volumes:
      - "${WORKSPACE_DIR}/database/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      # A bind-mounted workspace can need WAL recovery and fsync after an
      # interrupted Docker shutdown. Do not fail dependent services while
      # PostgreSQL is still completing that safe recovery path.
      start_period: 90s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: paper_workspace_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    image: paperark-backend:local
    container_name: paper_workspace_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://paper:paper123@db:5432/paper_workspace
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_DIR: /workspace
      BACKUP_DIR: /app/backups
      STORAGE_DIR: /workspace/storage
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1200}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.1}
      DEEP_READING_CONTEXT_BUDGET: ${DEEP_READING_CONTEXT_BUDGET:-12000}
      DEEP_READING_MAX_SOURCES: ${DEEP_READING_MAX_SOURCES:-20}
      DEEP_READING_SECTION_SOURCE_CAP: ${DEEP_READING_SECTION_SOURCE_CAP:-4}
      DEEP_READING_MAX_OUTPUT_TOKENS: ${DEEP_READING_MAX_OUTPUT_TOKENS:-4000}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - "${WORKSPACE_DIR}:/workspace"
      - "${BACKUP_DIR}:/app/backups"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    container_name: paper_workspace_frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    # /app/node_modules is an isolated Linux volume. Keep it synchronized with
    # the bind-mounted package-lock on every development-container start so a
    # dependency added in source cannot be hidden by a stale anonymous volume.
    command: sh -c "npm install --prefer-offline --no-audit --no-fund && npm run dev -- --host 0.0.0.0"

  ai-worker:
    build: ./backend
    image: paperark-backend:local
    container_name: paper_workspace_ai_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://paper:paper123@db:5432/paper_workspace
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_DIR: /workspace
      STORAGE_DIR: /workspace/storage
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    volumes:
      - ./backend:/app
      - "${WORKSPACE_DIR}:/workspace"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app.celery_app worker -Q ai --loglevel=INFO --concurrency=2

volumes:
  redisdata:
